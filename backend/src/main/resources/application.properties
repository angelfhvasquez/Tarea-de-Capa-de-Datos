spring.application.name=PET CENTER

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:petcenterdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Delay data scripts until after JPA schema creation
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Server Configuration
server.port=8080
server.servlet.context-path=/

# JWT Configuration
app.jwtSecret=PetCenterSecretKeyForJWTTokenGenerationAndValidation2024
app.jwtExpirationInMs=86400000

# Logging
logging.level.root=INFO
logging.level.com.petcenter=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
